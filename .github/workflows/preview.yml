name: PR preview

# Builds each pull request into gh-pages/pr-preview/pr-<n>/, comments the URL on the PR,
# smoke-tests the live preview, and removes it when the PR closes.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    # Fork PRs get a read-only token, so they can't push a preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      # No service worker on previews: its scope would overlap production.
      PUBLIC_ENABLE_SW: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: npm run build
      - name: Deploy or remove preview
        id: preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          wait-for-pages-deployment: true
      - name: Install Playwright browsers
        if: github.event.action != 'closed'
        run: npx playwright install --with-deps chromium webkit
      - name: Smoke test the live preview
        if: github.event.action != 'closed'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: npm run test:smoke
      - name: Upload Playwright report
        if: failure() && github.event.action != 'closed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 14
